<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Animated Weather App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:150vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#1d2671,#c33764);
    animation:bgMove 5s infinite alternate;
}

@keyframes bgMove{
    0%{
        background:linear-gradient(135deg,#1d2671,#c33764);
    }
    100%{
        background:linear-gradient(135deg,#00c6ff,#0072ff);
    }
}

/* Floating Circles */

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    animation:float 8s infinite ease-in-out;
}

.circle:nth-child(1){
    width:100px;
    height:100px;
    top:15%;
    left:5%;
}

.circle:nth-child(2){
    width:100px;
    height:100px;
    bottom:10%;
    right:10%;
    animation-duration:12s;
}

.circle:nth-child(3){
    width:100px;
    height:100px;
    top:60%;
    left:20%;
    animation-duration:15s;
}

@keyframes float{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-30px);
    }
    100%{
        transform:translateY(0px);
    }
}

/* Weather Card */

.weather-card{
    width:380px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    color:white;
    text-align:center;
    position:relative;
    z-index:10;
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:scale(0.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.weather-card h1{
    font-size:32px;
    margin-bottom:15px;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search-box input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:16px;
}

.search-box button{
    padding:12px 18px;
    border:none;
    border-radius:12px;
    background:#ff9800;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.search-box button:hover{
    transform:scale(1.05);
    background:#ffb300;
}

.weather-icon{
    width:110px;
    animation:spin 8s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

.temp{
    font-size:55px;
    font-weight:700;
    margin-top:10px;
}

.condition{
    font-size:22px;
    margin-top:5px;
}

.details{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.box{
    flex:1;
    padding:12px;
    border-radius:15px;
    background:rgba(255,255,255,0.15);
}

.calendar{
    margin-top:25px;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,0.15);
}

.calendar h3{
    margin-bottom:10px;
}

.date{
    font-size:18px;
}

.footer{
    margin-top:20px;
    font-size:13px;
    opacity:0.8;
}

</style>
</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="weather-card">

    <h1>🌦 Weather App</h1>

    <div class="search-box">
        <input type="text" id="city" placeholder="Enter city name">
        <button onclick="getWeather()">Search</button>
    </div>

    <img src="" class="weather-icon" id="icon">

    <div class="temp" id="temp">--°C</div>

    <div class="condition" id="condition">Weather Condition</div>

    <h2 id="location">City Name</h2>

    <div class="details">

        <div class="box">
            <h4>💧 Humidity</h4>
            <p id="humidity">--%</p>
        </div>

        <div class="box">
            <h4>🌬 Wind</h4>
            <p id="wind">-- km/h</p>
        </div>

    </div>

    <!-- Calendar -->

    <div class="calendar">
        <h3>📅 Calendar</h3>
        <div class="date" id="date"></div>
    </div>

    <div class="footer">
        Developed by Bapon Paramanik
    </div>

</div>

<script>

const apiKey = "999616c43a764d4b846141555251512";

async function getWeather(){

    const city = document.getElementById("city").value;

    if(city === ""){
        alert("Please enter city name");
        return;
    }

    const url = `http://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${city}&aqi=yes`;

    try{

        const response = await fetch(url);
        const data = await response.json();

        console.log(data);

        document.getElementById("temp").innerHTML =
        `${data.current.temp_c}°C`;

        document.getElementById("condition").innerHTML =
        data.current.condition.text;

        document.getElementById("location").innerHTML =
        data.location.name + ", " + data.location.country;

        document.getElementById("humidity").innerHTML =
        data.current.humidity + "%";

        document.getElementById("wind").innerHTML =
        data.current.wind_kph + " km/h";

        document.getElementById("icon").src =
        "https:" + data.current.condition.icon;

    }

    catch(error){
        alert("City not found!");
        console.log(error);
    }

}

/* Calendar */

function updateDate(){

    const today = new Date();

    const options = {
        weekday:'long',
        year:'numeric',
        month:'long',
        day:'numeric'
    };

    document.getElementById("date").innerHTML =
    today.toLocaleDateString('en-US', options);

}

updateDate();

</script>

</body>
</html>
